name: Executar Python

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  rodar-python:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip   # só funciona se existir requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upggrade pip
          pip install -r requirements.txt

      - name: Rodar script do repositório
        run: python main.py

      - name: Rodar código Python direto no YAML
        run: |
          python - <<'EOF'
          import sys, platform
          print("Python:", sys.version)
          print("Sistema:", platform.platform())
          EOF
